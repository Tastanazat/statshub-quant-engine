name: StatsHub Browser Scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statshub-quant-engine
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # =========================================================
      # 3. DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      # =========================================================
      # 4. PLAYWRIGHT CHROMIUM
      # =========================================================
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # =========================================================
      # 5. INITIALIZE DATABASE
      # =========================================================
      - name: Initialize database
        run: |
          python init_database.py

      # =========================================================
      # 6. VERIFY DATABASE
      # =========================================================
      - name: Verify database
        run: |
          python - <<'PY'
          import sqlite3
          import os

          db = "data/database/quant_engine.db"

          if not os.path.exists(db):
              raise SystemExit("DATABASE ERROR: quant_engine.db bulunamadı")

          conn = sqlite3.connect(db)
          cur = conn.cursor()

          cur.execute("""
              SELECT name
              FROM sqlite_master
              WHERE type='table'
              ORDER BY name
          """)

          tables = [row[0] for row in cur.fetchall()]

          required = [
              "matches",
              "predictions",
              "settlements",
              "model_versions",
              "model_performance",
              "calibration_history",
              "database_metadata"
          ]

          missing = [x for x in required if x not in tables]

          if missing:
              raise SystemExit(
                  "DATABASE ERROR: Eksik tablolar: "
                  + ", ".join(missing)
              )

          print("DATABASE VALIDATION: PASS")
          print("Tables:", ", ".join(tables))

          conn.close()
          PY

      # =========================================================
      # 7. STATSHUB SCRAPER
      # =========================================================
      - name: Run StatsHub scraper
        run: |
          python scrape_statshub.py

      # =========================================================
      # 8. STATSHUB DATA ANALYSIS
      # =========================================================
      - name: Run StatsHub analysis
        run: |
          python analyze_statshub.py

      # =========================================================
      # 9. BUILD MATCH MODEL
      # =========================================================
      - name: Build StatsHub match model
        run: |
          python build_match_model.py

      # =========================================================
      # 10. VERIFY MATCH MODEL
      # =========================================================
      - name: Verify match model
        run: |
          test -f data/statshub_match_model.json

          python - <<'PY'
          import json
          import os

          path = "data/statshub_match_model.json"

          if not os.path.exists(path):
              raise SystemExit("MATCH MODEL ERROR: Dosya bulunamadı")

          with open(path, "r", encoding="utf-8") as f:
              model = json.load(f)

          required = [
              "model_version",
              "fixture_id",
              "home_team",
              "away_team",
              "lambda_home",
              "lambda_away",
              "probabilities",
              "validation"
          ]

          missing = [x for x in required if x not in model]

          if missing:
              raise SystemExit(
                  "MATCH MODEL ERROR: Eksik alanlar: "
                  + ", ".join(missing)
              )

          validation = model.get("validation", {})

          if validation.get("passed") is not True:
              raise SystemExit(
                  "MATCH MODEL ERROR: Mathematical validation PASS değil"
              )

          print("MATCH MODEL VALIDATION: PASS")
          print("Model version:", model["model_version"])
          print("Fixture ID:", model["fixture_id"])
          print("Home:", model["home_team"])
          print("Away:", model["away_team"])
          print("Lambda Home:", model["lambda_home"])
          print("Lambda Away:", model["lambda_away"])
          PY

      # =========================================================
      # 11. RECORD MODEL PREDICTION
      # =========================================================
      - name: Record model prediction
        run: |
          python record_prediction.py

      # =========================================================
      # 12. VERIFY DATABASE AFTER PREDICTION
      # =========================================================
      - name: Verify prediction database
        run: |
          python - <<'PY'
          import sqlite3
          import os

          db = "data/database/quant_engine.db"

          if not os.path.exists(db):
              raise SystemExit(
                  "DATABASE ERROR: quant_engine.db bulunamadı"
              )

          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()

          # -----------------------------------------------------
          # Prediction count
          # -----------------------------------------------------
          cur.execute("""
              SELECT COUNT(*)
              FROM predictions
          """)

          prediction_count = cur.fetchone()[0]

          if prediction_count < 1:
              raise SystemExit(
                  "PREDICTION ERROR: predictions tablosunda kayıt yok"
              )

          # -----------------------------------------------------
          # Latest prediction
          # -----------------------------------------------------
          cur.execute("""
              SELECT
                  id,
                  match_id,
                  model_version,
                  model_locked,
                  home_win_probability,
                  draw_probability,
                  away_win_probability
              FROM predictions
              ORDER BY id DESC
              LIMIT 1
          """)

          row = cur.fetchone()

          if row is None:
              raise SystemExit(
                  "PREDICTION ERROR: Son prediction bulunamadı"
              )

          if int(row["model_locked"]) != 1:
              raise SystemExit(
                  "PREDICTION ERROR: Model LOCKED değil"
              )

          print("PREDICTION DATABASE VALIDATION: PASS")
          print("Prediction ID:", row["id"])
          print("Match ID:", row["match_id"])
          print("Model version:", row["model_version"])
          print("Model locked:", row["model_locked"])
          print("Home win:", row["home_win_probability"])
          print("Draw:", row["draw_probability"])
          print("Away win:", row["away_win_probability"])
          print("Total predictions:", prediction_count)

          conn.close()
          PY

      # =========================================================
      # 13. CHECK IMPORTANT FILES
      # =========================================================
      - name: Verify all output files
        run: |
          echo "======================================"
          echo "OUTPUT FILE CHECK"
          echo "======================================"

          test -f data/statshub_team_stats.json
          test -f data/statshub_team_analysis.json
          test -f data/statshub_match_model.json
          test -f data/database/quant_engine.db

          echo "StatsHub Team Stats       : OK"
          echo "StatsHub Team Analysis    : OK"
          echo "StatsHub Match Model      : OK"
          echo "Quant Engine Database     : OK"

          echo ""
          echo "Database size:"
          ls -lh data/database/quant_engine.db

          echo ""
          echo "Data directory:"
          find data -maxdepth 3 -type f | sort

      # =========================================================
      # 14. UPLOAD ARTIFACT
      # IMPORTANT:
      # Only ONE upload-artifact step exists.
      # Artifact name is unique for every workflow run.
      # =========================================================
      - name: Upload StatsHub data
        uses: actions/upload-artifact@v4
        with:
          name: statshub-scan-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15. PERSIST SQLITE DATABASE TO GITHUB
      # =========================================================
      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/database/quant_engine.db

          if git diff --cached --quiet; then
            echo "Database değişmedi."
          else
            git commit -m "Update Quant Engine database"
            git push
            echo "Database GitHub'a kaydedildi."
          fi

      # =========================================================
      # 16. FINAL STATUS
      # =========================================================
      - name: Final validation
        run: |
          echo ""
          echo "======================================"
          echo "STATSHUB QUANT ENGINE"
          echo "WORKFLOW COMPLETED SUCCESSFULLY"
          echo "======================================"
          echo ""
          echo "StatsHub data        : PASS"
          echo "Team analysis        : PASS"
          echo "Match model          : PASS"
          echo "Prediction record    : PASS"
          echo "Database validation  : PASS"
          echo "Artifact upload      : PASS"
          echo "Database persistence : PASS"
          echo ""
          echo "Workflow Run ID:"
          echo "${{ github.run_id }}"
