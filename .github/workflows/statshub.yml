name: StatsHub Browser Scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statshub-quant-engine
  cancel-in-progress: false

jobs:

  scrape:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # =========================================================
      # 2. PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # =========================================================
      # 3. DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests


      # =========================================================
      # 4. PLAYWRIGHT
      # =========================================================

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium


      # =========================================================
      # 5. DATABASE INITIALIZE
      # =========================================================

      - name: Initialize Quant Engine database
        run: |
          python init_database.py


      # =========================================================
      # 6. DATABASE VERIFY
      # =========================================================

      - name: Verify database
        run: |
          python - <<'PY'
          import sqlite3
          import os

          db = "data/database/quant_engine.db"

          if not os.path.exists(db):
              raise SystemExit(
                  "DATABASE ERROR: quant_engine.db bulunamadı."
              )

          conn = sqlite3.connect(db)
          cursor = conn.cursor()

          cursor.execute("""
              SELECT name
              FROM sqlite_master
              WHERE type='table'
          """)

          tables = {
              row[0]
              for row in cursor.fetchall()
          }

          required_tables = {
              "matches",
              "predictions",
              "settlements",
              "model_versions",
              "model_performance",
              "calibration_history",
              "database_metadata"
          }

          missing = required_tables - tables

          if missing:
              raise SystemExit(
                  "DATABASE ERROR: Eksik tablolar: "
                  + ", ".join(sorted(missing))
              )

          print("DATABASE VALIDATION: PASS")
          print(
              "Tables:",
              ", ".join(sorted(tables))
          )

          conn.close()
          PY


      # =========================================================
      # 7. STATSHUB SCRAPER
      # =========================================================

      - name: Run StatsHub scraper
        run: |
          python scrape_statshub.py


      # =========================================================
      # 8. STATSHUB ANALYSIS
      # =========================================================

      - name: Run StatsHub analysis
        run: |
          python analyze_statshub.py


      # =========================================================
      # 9. BUILD MATCH MODEL
      # =========================================================

      - name: Build StatsHub match model
        run: |
          python build_match_model.py


      # =========================================================
      # 10. VERIFY MATCH MODEL
      # =========================================================

      - name: Verify match model
        run: |
          python - <<'PY'
          import json
          import os
          import math

          path = "data/statshub_match_model.json"

          if not os.path.exists(path):
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "statshub_match_model.json bulunamadı."
              )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              model = json.load(f)

          # -----------------------------------------------------
          # SOURCE
          # -----------------------------------------------------

          if model.get("source") != "StatsHub":
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "Model kaynağı StatsHub değil."
              )

          # -----------------------------------------------------
          # MODEL VERSION
          # -----------------------------------------------------

          model_version = model.get(
              "model_version"
          )

          if not model_version:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "model_version bulunamadı."
              )

          # -----------------------------------------------------
          # FIXTURE
          # -----------------------------------------------------

          fixture = model.get(
              "fixture",
              {}
          )

          home = fixture.get("home")
          away = fixture.get("away")

          if not home:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "fixture.home bulunamadı."
              )

          if not away:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "fixture.away bulunamadı."
              )

          # -----------------------------------------------------
          # LAMBDA
          # -----------------------------------------------------

          lambdas = model.get(
              "lambda",
              {}
          )

          lambda_home = lambdas.get("home")
          lambda_away = lambdas.get("away")

          if lambda_home is None:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "lambda.home bulunamadı."
              )

          if lambda_away is None:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "lambda.away bulunamadı."
              )

          if not math.isfinite(
              float(lambda_home)
          ):
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "lambda.home geçersiz."
              )

          if not math.isfinite(
              float(lambda_away)
          ):
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "lambda.away geçersiz."
              )

          if float(lambda_home) <= 0:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "lambda.home sıfır veya negatif."
              )

          if float(lambda_away) <= 0:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "lambda.away sıfır veya negatif."
              )

          # -----------------------------------------------------
          # PROBABILITIES
          # -----------------------------------------------------

          probabilities = model.get(
              "probabilities",
              {}
          )

          required_probabilities = [
              "home_win",
              "draw",
              "away_win",
              "over_0_5",
              "under_0_5",
              "over_1_5",
              "under_1_5",
              "over_2_5",
              "under_2_5",
              "over_3_5",
              "under_3_5",
              "over_4_5",
              "under_4_5",
              "btts_yes",
              "btts_no"
          ]

          missing_probabilities = [
              key
              for key in required_probabilities
              if key not in probabilities
          ]

          if missing_probabilities:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "Eksik probability alanları: "
                  + ", ".join(
                      missing_probabilities
                  )
              )

          # -----------------------------------------------------
          # PROBABILITY RANGE CHECK
          # -----------------------------------------------------

          for key in required_probabilities:

              value = float(
                  probabilities[key]
              )

              if not math.isfinite(value):
                  raise SystemExit(
                      f"MATCH MODEL ERROR: "
                      f"{key} geçersiz."
                  )

              if value < 0 or value > 1:
                  raise SystemExit(
                      f"MATCH MODEL ERROR: "
                      f"{key} 0-1 aralığında değil."
                  )

          # -----------------------------------------------------
          # 1X2 SUM CHECK
          # -----------------------------------------------------

          one_x_two_sum = (
              float(probabilities["home_win"])
              + float(probabilities["draw"])
              + float(probabilities["away_win"])
          )

          if abs(
              one_x_two_sum - 1.0
          ) > 1e-6:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "1X2 olasılıkları toplamı 1 değil."
              )

          # -----------------------------------------------------
          # O/U SUM CHECK
          # -----------------------------------------------------

          for line in [
              "0_5",
              "1_5",
              "2_5",
              "3_5",
              "4_5"
          ]:

              over = float(
                  probabilities[
                      f"over_{line}"
                  ]
              )

              under = float(
                  probabilities[
                      f"under_{line}"
                  ]
              )

              if abs(
                  (over + under) - 1.0
              ) > 1e-6:
                  raise SystemExit(
                      f"MATCH MODEL ERROR: "
                      f"O/U {line} toplamı 1 değil."
                  )

          # -----------------------------------------------------
          # BTTS SUM CHECK
          # -----------------------------------------------------

          btts_sum = (
              float(probabilities["btts_yes"])
              + float(probabilities["btts_no"])
          )

          if abs(
              btts_sum - 1.0
          ) > 1e-6:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "BTTS toplamı 1 değil."
              )

          # -----------------------------------------------------
          # MODEL INTERNAL VALIDATION
          # -----------------------------------------------------

          validation = model.get(
              "validation",
              {}
          )

          validation_passed = validation.get(
              "validation_passed",
              False
          )

          if validation_passed is not True:
              raise SystemExit(
                  "MATCH MODEL ERROR: "
                  "Matematiksel validation PASS değil."
              )

          # -----------------------------------------------------
          # SUCCESS
          # -----------------------------------------------------

          print("")
          print("==========================================")
          print("MATCH MODEL VALIDATION: PASS")
          print("==========================================")
          print("")
          print("Source:", model["source"])
          print("Model:", model_version)
          print("Home:", home)
          print("Away:", away)
          print("Home Lambda:", lambda_home)
          print("Away Lambda:", lambda_away)
          print("")
          print(
              "Home Win:",
              probabilities["home_win"]
          )
          print(
              "Draw:",
              probabilities["draw"]
          )
          print(
              "Away Win:",
              probabilities["away_win"]
          )
          print("")
          print(
              "Over 2.5:",
              probabilities["over_2_5"]
          )
          print(
              "Under 2.5:",
              probabilities["under_2_5"]
          )
          print(
              "BTTS Yes:",
              probabilities["btts_yes"]
          )
          print(
              "BTTS No:",
              probabilities["btts_no"]
          )
          print("")
          print(
              "Mathematical Validation:",
              "PASS"
          )
          print("")
          PY


      # =========================================================
      # 11. RECORD MODEL PREDICTION
      # =========================================================

      - name: Record model prediction
        run: |
          python record_prediction.py


      # =========================================================
      # 12. CLEANUP OLD INVALID SETTLEMENT
      # =========================================================

      - name: Cleanup old invalid settlement
        run: |
          python cleanup_invalid_settlement.py


      # =========================================================
      # 13. RUN STATSHUB SETTLEMENT ENGINE
      # =========================================================

      - name: Run StatsHub settlement engine
        run: |
          python settle_prediction.py


      # =========================================================
      # 14. VERIFY PREDICTION DATABASE
      # =========================================================

      - name: Verify prediction database
        run: |
          python - <<'PY'
          import sqlite3
          import os

          db = "data/database/quant_engine.db"

          if not os.path.exists(db):
              raise SystemExit(
                  "DATABASE ERROR: Database bulunamadı."
              )

          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row

          cursor = conn.cursor()

          # -----------------------------------------------------
          # COUNT
          # -----------------------------------------------------

          cursor.execute("""
              SELECT COUNT(*)
              FROM predictions
          """)

          count = cursor.fetchone()[0]

          if count < 1:
              raise SystemExit(
                  "PREDICTION ERROR: "
                  "Prediction kaydı bulunamadı."
              )

          # -----------------------------------------------------
          # LATEST PREDICTION
          # -----------------------------------------------------

          cursor.execute("""
              SELECT
                  id,
                  match_id,
                  model_version,
                  model_locked,
                  home_win_probability,
                  draw_probability,
                  away_win_probability,
                  home_lambda,
                  away_lambda
              FROM predictions
              ORDER BY id DESC
              LIMIT 1
          """)

          row = cursor.fetchone()

          if row is None:
              raise SystemExit(
                  "PREDICTION ERROR: "
                  "Son prediction bulunamadı."
              )

          if int(
              row["model_locked"]
          ) != 1:
              raise SystemExit(
                  "PREDICTION ERROR: "
                  "Model LOCKED değil."
              )

          print("")
          print("==========================================")
          print("PREDICTION DATABASE VALIDATION: PASS")
          print("==========================================")
          print("")
          print(
              "Prediction ID:",
              row["id"]
          )
          print(
              "Match ID:",
              row["match_id"]
          )
          print(
              "Model:",
              row["model_version"]
          )
          print(
              "Model Locked:",
              row["model_locked"]
          )
          print(
              "Home Win:",
              row["home_win_probability"]
          )
          print(
              "Draw:",
              row["draw_probability"]
          )
          print(
              "Away Win:",
              row["away_win_probability"]
          )
          print(
              "Home Lambda:",
              row["home_lambda"]
          )
          print(
              "Away Lambda:",
              row["away_lambda"]
          )
          print(
              "Total Predictions:",
              count
          )
          print("")

          conn.close()
          PY


      # =========================================================
      # 15. VERIFY SETTLEMENT DATABASE
      # =========================================================

      - name: Verify settlement database
        run: |
          python - <<'PY'
          import sqlite3
          import os

          db = "data/database/quant_engine.db"

          if not os.path.exists(db):
              raise SystemExit(
                  "SETTLEMENT DATABASE ERROR: "
                  "Database bulunamadı."
              )

          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row

          cursor = conn.cursor()

          # -----------------------------------------------------
          # SETTLEMENT COUNT
          # -----------------------------------------------------

          cursor.execute("""
              SELECT COUNT(*)
              FROM settlements
          """)

          settlement_count = cursor.fetchone()[0]

          # -----------------------------------------------------
          # CURRENT MATCH
          # -----------------------------------------------------

          cursor.execute("""
              SELECT
                  id,
                  statshub_fixture_id,
                  home_team,
                  away_team,
                  status,
                  final_home_score,
                  final_away_score
              FROM matches
              WHERE statshub_fixture_id = ?
              LIMIT 1
          """, ("416477",))

          match = cursor.fetchone()

          if match is None:
              raise SystemExit(
                  "SETTLEMENT DATABASE ERROR: "
                  "PSV-Shakhtar fixture bulunamadı."
              )

          print("")
          print("==========================================")
          print("SETTLEMENT DATABASE VALIDATION")
          print("==========================================")
          print("")

          print(
              "Fixture:",
              match["statshub_fixture_id"]
          )

          print(
              "Match:",
              match["home_team"],
              "vs",
              match["away_team"]
          )

          print(
              "Status:",
              match["status"]
          )

          print(
              "Final score:",
              match["final_home_score"],
              "-",
              match["final_away_score"]
          )

          print(
              "Total settlements:",
              settlement_count
          )

          # -----------------------------------------------------
          # IF MATCH IS NOT FINISHED
          # -----------------------------------------------------

          if match["status"] == "notstarted":

              if (
                  match["final_home_score"] is not None
                  or
                  match["final_away_score"] is not None
              ):
                  raise SystemExit(
                      "SETTLEMENT DATABASE ERROR: "
                      "notstarted maçta final skor var."
                  )

              print("")
              print(
                  "MATCH STATUS: NOT STARTED"
              )
              print(
                  "Final result: NOT AVAILABLE"
              )
              print(
                  "Settlement: NONE EXPECTED"
              )

          # -----------------------------------------------------
          # IF MATCH IS FINISHED
          # -----------------------------------------------------

          elif match["status"] in (
              "finished",
              "ended",
              "completed"
          ):

              if (
                  match["final_home_score"] is None
                  or
                  match["final_away_score"] is None
              ):
                  raise SystemExit(
                      "SETTLEMENT DATABASE ERROR: "
                      "Finished maçta final skor yok."
                  )

              print("")
              print(
                  "MATCH STATUS: FINISHED"
              )
              print(
                  "Final result:",
                  match["final_home_score"],
                  "-",
                  match["final_away_score"]
              )

          print("")
          print(
              "SETTLEMENT DATABASE VALIDATION: PASS"
          )
          print("")

          conn.close()
          PY


      # =========================================================
      # 16. VERIFY OUTPUT FILES
      # =========================================================

      - name: Verify output files
        run: |
          test -f data/statshub_team_stats.json
          test -f data/statshub_team_analysis.json
          test -f data/statshub_match_model.json
          test -f data/database/quant_engine.db

          echo "=========================================="
          echo "OUTPUT FILE VALIDATION: PASS"
          echo "=========================================="

          echo ""
          echo "StatsHub Team Stats      : OK"
          echo "StatsHub Team Analysis   : OK"
          echo "StatsHub Match Model     : OK"
          echo "Quant Engine Database    : OK"
          echo "Settlement Engine        : OK"

          echo ""
          echo "Data files:"
          find data -maxdepth 3 -type f | sort


      # =========================================================
      # 17. UPLOAD ARTIFACT
      #
      # SADECE 1 KEZ
      # =========================================================

      - name: Upload StatsHub data
        uses: actions/upload-artifact@v6
        with:
          name: statshub-scan-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 18. PERSIST DATABASE
      # =========================================================

      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/database/quant_engine.db

          if git diff --cached --quiet; then

            echo "Database değişmedi."

          else

            git commit \
              -m "Update Quant Engine database"

            git push

            echo "Database GitHub repository'ye kaydedildi."

          fi


      # =========================================================
      # 19. FINAL
      # =========================================================

      - name: Final validation
        run: |
          echo ""
          echo "=========================================="
          echo "STATSHUB QUANT ENGINE"
          echo "WORKFLOW SUCCESS"
          echo "=========================================="
          echo ""

          echo "StatsHub scraping       : PASS"
          echo "StatsHub analysis       : PASS"
          echo "Poisson model           : PASS"
          echo "Model validation        : PASS"
          echo "Prediction recording    : PASS"
          echo "Invalid cleanup         : PASS"
          echo "Settlement Engine       : PASS"
          echo "Database validation     : PASS"
          echo "Artifact upload         : PASS"
          echo "Database persistence    : PASS"

          echo ""
          echo "SYSTEM READY"
